<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Davids Wunschliste</title>
<meta name="description" content="Davids Wunschliste – wer etwas schenkt, hakt es hier ab, damit niemand doppelt kauft.">
<meta name="theme-color" content="#14301f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛳</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap">
<link rel="stylesheet" href="css/style.css?v=26">
</head>
<body>

<!-- Beim Scrollen rollt ein Ball über den unteren Bildschirmrand auf
     Loch 18 zu und fällt am Ende der Seite ein. Rein dekorativ, ohne
     JavaScript: die Animation hängt direkt am Scrollfortschritt. -->
<div class="putt" aria-hidden="true">
  <span class="putt-flag">
    <svg viewBox="0 0 56 96" width="56" height="96" role="presentation" focusable="false">
      <ellipse cx="20" cy="88" rx="15" ry="5" fill="#0a1d12" opacity=".55"/>
      <ellipse cx="20" cy="86" rx="11" ry="3.6" fill="#09150d"/>
      <ellipse cx="20" cy="85" rx="11" ry="3.6" fill="none" stroke="#e9e1cb" stroke-width="1" opacity=".5"/>
      <path d="M20 86V10" stroke="#f4efe2" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M20 86V10" stroke="#0a1d12" stroke-width=".8" stroke-dasharray="9 9" opacity=".35"/>
      <path d="M20 11h30l-8 10 8 10H20z" fill="#8f2f28"/>
      <path d="M20 11h30l-8 10 8 10H20z" fill="none" stroke="#5d1c17" stroke-width=".9"/>
      <text x="31" y="25" font-family="Inter, sans-serif" font-size="11" font-weight="700"
            fill="#f7f1e2" text-anchor="middle">18</text>
    </svg>
  </span>
  <span class="putt-line"></span>
  <span class="putt-ball ball"></span>
</div>

<!-- Einmalige Begrüßung: beim Öffnen der Seite fallen Bälle herein,
     springen einmal auf und verschwinden wieder. Rein dekorativ. -->
<div class="drop" aria-hidden="true">
  <span class="ball"     style="--x:7%;  --s:26px; --dur:2.1s; --d:.05s; --drift:14px;  --spin:420deg"></span>
  <span class="ball"     style="--x:16%; --s:18px; --dur:2.4s; --d:.42s; --drift:-9px;  --spin:-300deg"></span>
  <span class="football" style="--x:24%; --s:30px; --dur:2.2s; --d:.68s; --drift:18px;  --spin:340deg"></span>
  <span class="ball"     style="--x:33%; --s:22px; --dur:2.5s; --d:.18s; --drift:-16px; --spin:380deg"></span>
  <span class="tee"      style="--x:41%; --s:24px; --dur:2.3s; --d:.95s; --drift:11px;  --spin:520deg"></span>
  <span class="ball"     style="--x:49%; --s:28px; --dur:2.0s; --d:.55s; --drift:-12px; --spin:-360deg"></span>
  <span class="ball"     style="--x:57%; --s:16px; --dur:2.6s; --d:.3s;  --drift:15px;  --spin:300deg"></span>
  <span class="tennis"   style="--x:65%; --s:24px; --dur:2.3s; --d:.8s;  --drift:-14px; --spin:400deg"></span>
  <span class="ball"     style="--x:73%; --s:24px; --dur:2.2s; --d:.12s; --drift:10px;  --spin:-420deg"></span>
  <span class="ball"     style="--x:81%; --s:19px; --dur:2.5s; --d:.62s; --drift:-17px; --spin:360deg"></span>
  <span class="tee"      style="--x:88%; --s:21px; --dur:2.4s; --d:1.05s; --drift:8px;  --spin:-480deg"></span>
  <span class="ball"     style="--x:94%; --s:27px; --dur:2.1s; --d:.35s; --drift:-11px; --spin:400deg"></span>
</div>

<!-- Dekorative Ebene: langsam schwebende Golfbälle, ein paar Tees und
     vereinzelt ein Tennis- oder Fußball. Rein visuell, aria-hidden,
     liegt hinter allen Inhalten und fängt keine Klicks ab. -->
<div class="motes" aria-hidden="true">
  <span class="mote ball"   style="--x:3%;    --s:16px; --dur:64s; --d:-8s;  --drift:-26px"></span>
  <span class="mote ball"   style="--x:8.5%;  --s:10px; --dur:78s; --d:-31s; --drift:18px"></span>
  <span class="mote tee"    style="--x:13%;   --s:20px; --dur:86s; --d:-52s; --drift:-12px; --rot:-14deg"></span>
  <span class="mote ball"   style="--x:18%;   --s:22px; --dur:71s; --d:-17s; --drift:22px"></span>
  <span class="mote ball"   style="--x:24%;   --s:12px; --dur:92s; --d:-64s; --drift:-9px"></span>
  <span class="mote tennis" style="--x:30%;   --s:15px; --dur:84s; --d:-40s; --drift:16px"></span>
  <span class="mote ball"   style="--x:36%;   --s:18px; --dur:69s; --d:-25s; --drift:-18px"></span>
  <span class="mote ball"   style="--x:43%;   --s:11px; --dur:88s; --d:-57s; --drift:12px"></span>
  <span class="mote ball"   style="--x:50%;   --s:14px; --dur:76s; --d:-11s; --drift:-20px"></span>
  <span class="mote tee"    style="--x:57%;   --s:17px; --dur:95s; --d:-70s; --drift:9px;   --rot:22deg"></span>
  <span class="mote ball"   style="--x:63%;   --s:20px; --dur:66s; --d:-35s; --drift:24px"></span>
  <span class="mote ball"   style="--x:69%;   --s:13px; --dur:82s; --d:-6s;  --drift:-14px"></span>
  <span class="mote football" style="--x:75%; --s:16px; --dur:90s; --d:-47s; --drift:10px"></span>
  <span class="mote ball"   style="--x:81%;   --s:17px; --dur:73s; --d:-21s; --drift:-23px"></span>
  <span class="mote ball"   style="--x:87%;   --s:11px; --dur:94s; --d:-61s; --drift:15px"></span>
  <span class="mote tee"    style="--x:92%;   --s:19px; --dur:80s; --d:-29s; --drift:-11px; --rot:8deg"></span>
  <span class="mote ball"   style="--x:96.5%; --s:15px; --dur:68s; --d:-44s; --drift:20px"></span>
</div>

<header class="hero">
  <div class="hero-inner">
    <div class="hero-text">
      <span class="hero-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="40" height="40" role="presentation" focusable="false">
          <circle cx="20" cy="20" r="19" fill="#f6f1e4" fill-opacity=".12" stroke="#cdb98a" stroke-width="1.2"/>
          <path d="M15 30V11l11 4-11 4" fill="#a8bf7a" stroke="#f6f1e4" stroke-width="1.4" stroke-linejoin="round"/>
          <circle cx="15" cy="30" r="2.2" fill="#f6f1e4"/>
        </svg>
      </span>
      <h1>Davids Wünsche</h1>
      <p class="lede">Wähle einen Wunsch aus und reserviere ihn mit einem kurzen Passwort.
        Damit kannst du ihn später wieder aufheben. David sieht nicht, wer welchen
        Wunsch auswählt.</p>
    </div>
  </div>

  <!-- Golfplatz in der Abenddämmerung: Himmel mit tiefstehender Sonne,
       dunstige Hügelketten, Baumreihe, Horizontnebel, perspektivisch
       zulaufende Mähbahnen, Bunker und das Grün mit Fahne. Reines SVG
       plus eine kleine Rauschkachel – kein einziges Foto. -->
  <div class="hero-scene" aria-hidden="true">
    <svg viewBox="0 0 1440 620" preserveAspectRatio="xMidYMax slice" role="presentation" focusable="false">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0"    stop-color="#06150e"/>
          <stop offset=".3"   stop-color="#0c2517"/>
          <stop offset=".62"  stop-color="#173a26"/>
          <stop offset=".86"  stop-color="#2c5738"/>
          <stop offset="1"    stop-color="#4a7248"/>
        </linearGradient>
        <radialGradient id="sun" cx=".66" cy=".49" r=".42">
          <stop offset="0"   stop-color="#f0dca6" stop-opacity=".62"/>
          <stop offset=".28" stop-color="#cbb478" stop-opacity=".3"/>
          <stop offset="1"   stop-color="#cbb478" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2c5a42"/><stop offset="1" stop-color="#436c4c"/>
        </linearGradient>
        <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1b4029"/><stop offset="1" stop-color="#2a5634"/>
        </linearGradient>
        <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0"   stop-color="#cfe0c4" stop-opacity="0"/>
          <stop offset=".45" stop-color="#cfe0c4" stop-opacity=".34"/>
          <stop offset="1"   stop-color="#cfe0c4" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0"   stop-color="#091d12" stop-opacity="0"/>
          <stop offset=".55" stop-color="#091d12" stop-opacity=".3"/>
          <stop offset="1"   stop-color="#091d12" stop-opacity=".82"/>
        </linearGradient>
        <radialGradient id="spot" cx=".78" cy=".62" r=".5">
          <stop offset="0" stop-color="#8fc08f" stop-opacity=".2"/>
          <stop offset="1" stop-color="#8fc08f" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="vignette" cx=".5" cy=".4" r=".82">
          <stop offset=".45" stop-color="#000" stop-opacity="0"/>
          <stop offset="1"   stop-color="#000" stop-opacity=".48"/>
        </radialGradient>
        <radialGradient id="sandG" cx=".42" cy=".3" r=".8">
          <stop offset="0" stop-color="#f3e9cd"/><stop offset="1" stop-color="#c9b485"/>
        </radialGradient>
        <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
        <filter id="softer"><feGaussianBlur stdDeviation="7"/></filter>
        <filter id="mistBlur"><feGaussianBlur stdDeviation="9"/></filter>
      </defs>

      <rect width="1440" height="620" fill="url(#sky)"/>
      <rect width="1440" height="620" fill="url(#sun)"/>

      <!-- Luftperspektive: hinten heller, weicher, flacher -->
      <g filter="url(#softer)" opacity=".5">
        <path d="M0 232 C 160 178, 316 208, 470 194 C 628 180, 748 212, 908 192
                 C 1064 172, 1268 210, 1440 186 L1440 302 L0 302 Z" fill="url(#hillFar)"/>
      </g>
      <g filter="url(#soft)" opacity=".72">
        <path d="M0 258 C 196 216, 352 250, 534 238 C 716 226, 866 258, 1052 240
                 C 1222 224, 1342 252, 1440 242 L1440 306 L0 306 Z" fill="url(#hillMid)"/>
      </g>

      <!-- Baumreihe, unscharf wie eine echte Ferne -->
      <g opacity=".9" filter="url(#soft)">
        <path d="M0 282 q10-14 20-4 q9-16 19-3 q11-18 21-2 q8-13 18-3 q12-19 22-3
                 q9-15 19-2 q11-17 21-3 q8-12 18-2 q12-18 22-3 q10-16 20-2 q11-17 21-3
                 q9-13 19-2 q12-19 22-3 q10-15 20-2 q11-18 21-3 q8-12 18-2 q12-17 22-3
                 q10-16 20-2 q11-18 21-2 q9-13 19-3 q12-18 22-2 q10-15 20-3 q11-17 21-2
                 q8-13 18-3 q12-18 22-2 q10-16 20-3 q11-17 21-2 q9-12 19-3 q12-19 22-2
                 q10-15 20-3 q11-17 21-2 q8-13 18-2 q12-18 22-3 q10-16 20-2 q11-17 21-3
                 q9-12 19-2 q12-18 22-3 q10-15 20-2 q11-18 21-3 q8-12 18-2 q12-17 22-3
                 q10-16 20-2 q11-18 21-2 q9-13 19-3 q12-18 22-2 q10-15 20-3 q11-17 21-2
                 q8-13 18-3 q12-18 22-2 q10-16 20-3 q11-17 21-2 q9-12 19-3 q12-19 22-2
                 q10-15 20-3 q11-17 21-2 q8-13 18-2 q12-18 22-3 q10-16 20-2 q11-17 21-3
                 L1440 310 L0 310 Z" fill="#0e2c1d"/>
      </g>

      <!-- Fairway -->
      <g>
        <polygon points="760,300 -1400,620 -1170,620" fill="#2d6b44"/>
        <polygon points="760,300 -1170,620 -940,620" fill="#245839"/>
        <polygon points="760,300 -940,620 -710,620" fill="#2d6b44"/>
        <polygon points="760,300 -710,620 -480,620" fill="#245839"/>
        <polygon points="760,300 -480,620 -250,620" fill="#2d6b44"/>
        <polygon points="760,300 -250,620 -20,620" fill="#245839"/>
        <polygon points="760,300 -20,620 210,620" fill="#2d6b44"/>
        <polygon points="760,300 210,620 440,620" fill="#245839"/>
        <polygon points="760,300 440,620 670,620" fill="#2d6b44"/>
        <polygon points="760,300 670,620 900,620" fill="#245839"/>
        <polygon points="760,300 900,620 1130,620" fill="#2d6b44"/>
        <polygon points="760,300 1130,620 1360,620" fill="#245839"/>
        <polygon points="760,300 1360,620 1590,620" fill="#2d6b44"/>
        <polygon points="760,300 1590,620 1820,620" fill="#245839"/>
        <polygon points="760,300 1820,620 2050,620" fill="#2d6b44"/>
        <polygon points="760,300 2050,620 2280,620" fill="#245839"/>
        <polygon points="760,300 2280,620 2510,620" fill="#2d6b44"/>
        <polygon points="760,300 2510,620 2740,620" fill="#245839"/>
        <polygon points="760,300 2740,620 2850,620" fill="#2d6b44"/>
      </g>

      <linearGradient id="flat" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse"
                      y1="300" y2="470">
        <stop offset="0"   stop-color="#28603e" stop-opacity=".92"/>
        <stop offset=".55" stop-color="#28603e" stop-opacity=".42"/>
        <stop offset="1"   stop-color="#28603e" stop-opacity="0"/>
      </linearGradient>
      <rect x="0" y="300" width="1440" height="170" fill="url(#flat)"/>

      <!-- Bodennebel über der Ferne: verdeckt den Fluchtpunkt und trennt
           Platz von Horizont, wie an einem feuchten Abend. -->
      <rect x="-40" y="266" width="1520" height="86" fill="url(#mist)" filter="url(#mistBlur)"/>

      <!-- Bunker: Schattenrand, Sandfläche, heller Grat -->
      <g>
        <ellipse cx="292" cy="452" rx="146" ry="32" fill="#0f2a19" opacity=".6" filter="url(#soft)"/>
        <ellipse cx="294" cy="445" rx="132" ry="25" fill="#1a3c26"/>
        <ellipse cx="296" cy="442" rx="124" ry="21" fill="url(#sandG)" opacity=".78"/>
        <ellipse cx="298" cy="436" rx="96" ry="12" fill="#efe4c6" opacity=".3"/>
        <path d="M172 441 a124 21 0 0 1 248 0" fill="none" stroke="#0f2a19"
              stroke-width="3" opacity=".45" filter="url(#soft)"/>
      </g>

      <!-- Grün mit Fahne und Loch -->
      <g class="hero-flag">
        <ellipse cx="1136" cy="420" rx="196" ry="44" fill="#337a4b" opacity=".5" filter="url(#soft)"/>
        <ellipse cx="1136" cy="416" rx="160" ry="34" fill="#3a8a55" opacity=".45"/>
        <ellipse cx="1136" cy="414" rx="10" ry="4" fill="#08170e"/>
        <path d="M1136 414V300" stroke="#f7f3e8" stroke-width="3" stroke-linecap="round"/>
        <path d="M1136 302l38 11-38 11z" fill="#8f2f28" stroke="#5d1c17" stroke-width=".9"/>
      </g>

      <rect width="1440" height="620" fill="url(#spot)"/>
      <rect y="330" width="1440" height="290" fill="url(#fade)"/>
      <rect width="1440" height="620" fill="url(#vignette)"/>
    </svg>

    <!-- Grasnarbe und Filmkorn: eine 180px-Kachel aus fraktalem Rausch,
         multipliziert über die Szene. Kostet ein paar hundert Byte. -->
    <span class="hero-grain"></span>
  </div>

  <div class="tartan-band" aria-hidden="true"></div>
</header>

<main class="wrap">

  <div class="adminbar" id="adminbar" hidden>
    <span class="adminbar-label">Admin-Modus</span>
    <div class="adminbar-actions">
      <button class="primary small" id="admin-toggle" type="button">Wunsch hinzufügen</button>
      <button class="ghost small" id="logout" type="button">Abmelden</button>
    </div>
  </div>

  <section class="panel" id="admin-panel" hidden>
    <h2 id="form-heading">Neuer Wunsch</h2>
    <form id="wish-form" autocomplete="off">
      <input type="hidden" id="edit-id">
      <div class="field">
        <label for="f-title">Artikel <span class="req">*</span></label>
        <input id="f-title" name="title" type="text" required maxlength="140" placeholder="z. B. Kaschmirschal, beige">
      </div>
      <div class="row">
        <div class="field">
          <label for="f-price">Preis (ca.) <span class="hint">(€ kommt automatisch)</span></label>
          <input id="f-price" name="price" type="text" maxlength="40" placeholder="49">
        </div>
        <div class="field grow">
          <label for="f-link">Link zum Shop <span class="hint">(Bild wird daraus geholt)</span></label>
          <input id="f-link" name="link" type="url" maxlength="600" placeholder="https://…">
        </div>
      </div>

      <div class="imgstatus" id="image-status" hidden>
        <img id="image-preview" alt="" hidden>
        <span id="image-status-text"></span>
        <button type="button" class="linkish" id="image-manual">Bild selbst angeben</button>
      </div>

      <div class="field">
        <label for="f-note">Bemerkung <span class="hint">(z. B. Größe 86, Farbe rosé)</span></label>
        <input id="f-note" name="note" type="text" maxlength="200" placeholder="Größe 86">
      </div>

      <div class="field" id="image-row" hidden>
        <label for="f-image">Bild-URL <span class="hint">(Rechtsklick aufs Produktbild → „Bildadresse kopieren")</span></label>
        <input id="f-image" name="image_url" type="url" maxlength="600" placeholder="https://…jpg">
      </div>

      <div class="form-actions">
        <button type="submit" class="primary" id="submit-btn">Hinzufügen</button>
        <button type="button" class="ghost" id="cancel-edit" hidden>Abbrechen</button>
        <span class="form-msg" id="form-msg" role="status" aria-live="polite"></span>
      </div>
    </form>
  </section>

  <div class="notice" id="notice" role="status" aria-live="polite" hidden></div>

  <section id="list" class="list" aria-label="Wunschliste"></section>

  <p class="empty" id="empty" hidden>Noch keine Wünsche eingetragen.</p>

  <section class="summary reveal" id="stats" hidden aria-label="Übersicht">
    <div class="stat"><span class="stat-num" id="stat-total">0</span><span class="stat-label">Wünsche</span></div>
    <div class="stat"><span class="stat-num" id="stat-open">0</span><span class="stat-label">noch offen</span></div>
    <div class="stat"><span class="stat-num" id="stat-taken">0</span><span class="stat-label">vergeben</span></div>
  </section>

  <div class="toolbar reveal" id="toolbar" hidden>
    <label class="switch">
      <input type="checkbox" id="hide-taken">
      <span>Vergebene ausblenden</span>
    </label>
  </div>

</main>

<div class="ausklang" aria-hidden="true"></div>

<footer>
  <span class="shell-divider" aria-hidden="true"></span>
  <small>Reservierungen sind anonym</small>

  <div class="login" id="login">
    <button type="button" class="linkish" id="login-open">Verwalten</button>
    <form id="login-form" hidden autocomplete="off">
      <label class="sr-only" for="login-pw">Passwort</label>
      <input id="login-pw" type="password" placeholder="Passwort" autocomplete="current-password">
      <button type="submit" class="primary small">Anmelden</button>
      <button type="button" class="linkish" id="login-cancel">Abbrechen</button>
      <p class="login-msg" id="login-msg" role="status" aria-live="polite"></p>
    </form>
  </div>
</footer>

<script src="js/config.js?v=26"></script>
<script src="js/app.js?v=26"></script>
</body>
</html>
